name: Update IPTV playlist

on:
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: iptv-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build playlist + EPG
        working-directory: scripts
        run: python build.py

      - name: Commit and push if changed
        run: |
          git config user.name "iptv-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "No changes (or build failed validation) - keeping previous published version."
          else
            git commit -m "Auto-update playlist $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
